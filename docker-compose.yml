services:
  mysql:
    image: mysql:8.4
    container_name: dwo-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dwo_root_pass
      MYSQL_DATABASE: dwo_graphic_design_masterclass
      MYSQL_USER: dwo
      MYSQL_PASSWORD: dwo_local_pass
    volumes:
      - dwo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdwo_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dwo_mysql_data:
